<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Soporte</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>
    <header>
        <div class="headerI">
            <img src="img/logotipo.png" alt="Logotipo Beauty Store" class="logoH"/>
            <nav id="BarraI">
                <ul>
                    <li><a href="registro.html">Home</a></li>
                    <li><a href="soporte.html">Support</a></li>
                    <li><a href="pedido.html">Shop</a></li>
                    <li><a href="encuesta.html">About</a></li>
                </ul>
            </nav>
        </div>
        <div class="headerD">
            <nav id="BarraIc">
                <ul>
                    <li><span class="material-symbols-outlined">local_mall</span></li>
                    <li><span class="material-symbols-outlined">favorite</span></li>
                    <li><span class="material-symbols-outlined">person</span></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section id="principal">
            <section class="logo">
                <article class="logoI">
                    <img src="img/logotipo.png" alt="Logotipo Beauty Store"/>
                    <h3>BEAUTY STORE</h3>
                </article>
            </section>
            <section class="registro">
                <article class="cuadroR">
                    <h2>SOPORTE TÉCNICO<br>Y CONTACTO</h2>
                    <form action="#" method="POST">
                        <fieldset id="datos_user">
                            <legend>Atención al cliente</legend>
                            <div class="c">
                                <label>Nombre completo:</label>
                                <input type="text" name="nombre" required>
                            </div>
                            <div class="c">
                                <label>Correo de contacto:</label>
                                <input type="email" name="mail" required>
                            </div>
                            <div class="c">
                                <label>Motivo de consulta:</label>
                                <select name="motivo" required>
                                    <option value="pedido">Duda sobre mi pedido</option>
                                    <option value="producto">Defecto o falla en producto</option>
                                    <option value="devolucion">Solicitud de devolución</option>
                                    <option value="otro">Otro asunto</option>
                                </select>
                            </div>
                            <div class="c">
                                <label>Mensaje o comentario:</label>
                                <textarea name="mensaje" columns="4" rows="4" required></textarea>
                            </div>
                            <div class="c">
                                <label>Adjuntar imagen:</label>
                                <input type="file" name="archivo" class="prueba">
                            </div>
                        </fieldset>
                        <button type="submit" class="b">Enviar</button>
                    </form>
                </article>
            </section>
        </section>
    </main>
    <footer>
        <nav class="pie">
            <ul>
                <li><a>Sobre nosotros</a></li>
                <li><a>Términos de servicio</a></li>
                <li><a>Políticas de privacidad</a></li>
            </ul>
        </nav>
    </footer>
</body>
</html>
