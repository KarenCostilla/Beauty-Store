<body>
    <header>
        <div class="headerI">
            <img src="img/logotipo.png" alt="Logotipo Beauty Store" class="logoH"/>
            <nav id="BarraI">
                <ul>
                    <li><a href="registro.html">Home</a></li>
                    <li><a href="soporte.html">Contact</a></li>
                    <li><a href="pedido.html">Shop</a></li>

                </ul>
            </nav>
            <div class="headerC">
                <div class="busqueda">
                    <input type="search" placeholder="Buscar">
                </div>
            </div>
        </div>
        <div class="headerD">
            <nav id="BarraIc">
                <ul>
                    <li><a href="favoritos.html"><span class="material-symbols-outlined">favorite</span></a></li>
                    <li><a href="carrito.html"><span class="material-symbols-outlined">local_mall</span></a></li>
                    <li><a href="mi_cuenta.html"><span class="material-symbols-outlined">person</span></a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section id="principal">
            <section class="logo">
                <article class="logoI">
                    <img src="img/logotipo.png" alt="Logotipo Beauty Store"/>
                    <h3>BEAUTY STORE</h3>
                </article>
            </section>

            <section class="registro">
                <article class="cuadroR">
                    <h2>REALIZAR TU<br>PEDIDO</h2>
                    <form action="#" method="POST">
                        <fieldset id="datos_user">
                            <legend>Detalles de compra</legend>
                            <div class="c">
                                <label>Producto a solicitar:</label>
                                <select name="producto" required>
                                    <option value="brochas">Set de brochas</option>
                                    <option value="labial">Labial líquido mate</option>
                                    <option value="paleta">Paleta de sombras</option>
                                    <option value="base">Base de maquillaje</option>
                                </select>
                            </div>
                            <div class="c">
                                <label>Cantidad:</label>
                                <input type="number" name="cantidad" min="1" max="10" required>
                            </div>
                            <div class="c">
                                <label>Fecha preferida de entrega:</label>
                                <input type="date" name="fechae" required>
                            </div>
                            <div class="c">
                                <label>Dirección de envío:</label>
                                <input type="text" name="direccion" required>
                            </div>
                            <div class="c">
                                <label>Método de pago:</label>
                                <select name="pago" required>
                                    <option value="tarjeta">Tarjeta de crédito/débito</option>
                                    <option value="transferencia">Transferencia bancaria</option>
                                    <option value="efectivo">Pago en efectivo</option>
                                </select>
                            </div>
                        </fieldset>
                        <button type="submit" class="b">Confirmar Pedido</button>
                    </form>
                </article>
            </section>
        </section>
    </main>
    <footer>
        <nav class="pie">
